name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-3.0 libportaudio2 libopus0 xvfb xauth
          python3 -m venv --system-site-packages .venv-linux
          .venv-linux/bin/python -m pip install -r requirements.txt

      - name: Test
        run: |
          .venv-linux/bin/python -m compileall -q app
          PYTHONPATH=app .venv-linux/bin/python -m unittest discover -s tests -v
          xvfb-run -a sh -ec '
            export XDG_CONFIG_HOME="$(mktemp -d)" XDG_STATE_HOME="$(mktemp -d)"
            ./doubao-voice --settings --no-tray &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if ./doubao-voice --cancel 2>/dev/null; then break; fi
              sleep 0.1
            done
            ./doubao-voice --cancel
            ./doubao-voice --settings
            ./doubao-voice --quit
            wait "$app_pid"
          '

      - name: Package Linux source
        run: |
          mkdir -p dist
          tar -czf dist/DoubaoVoice-linux.tar.gz doubao-voice requirements.txt README.md docs/linux.md THIRD_PARTY_NOTICES.md app/*.py

      - uses: actions/upload-artifact@v7
        with:
          name: DoubaoVoice-linux-${{ github.sha }}
          path: dist/DoubaoVoice-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DoubaoVoice-linux-${{ github.sha }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DoubaoVoice-linux.tar.gz --repo "$GITHUB_REPOSITORY" --title "豆包语音输入 $GITHUB_REF_NAME" --generate-notes
